<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radar de Voos</title>
  </head>
  <body>
    <div id="map"></div>
    <div id="status">Carregando…</div>
    <a id="probe-link" href="probe.html">Testar APIs</a>
    <aside id="panel" hidden aria-live="polite">
      <header>
        <img class="logo" alt="" hidden />
        <div class="title">
          <h2></h2>
          <p class="airline"></p>
        </div>
        <button class="close" type="button" aria-label="Fechar">×</button>
      </header>
      <p class="route-line" hidden></p>
      <figure class="photo" hidden>
        <a target="_blank" rel="noopener"><img alt="Foto da aeronave" /></a>
        <figcaption></figcaption>
      </figure>
      <dl></dl>
      <p class="note" hidden>Horários estimados pela distância e velocidade atuais; não são os horários oficiais do voo.</p>
    </aside>
    <div id="toast" role="status" aria-live="polite" hidden>
      <div class="toast-body">
        <p class="toast-title"></p>
        <ol class="toast-steps" hidden></ol>
      </div>
      <div class="toast-actions">
        <button class="toast-action" type="button" hidden></button>
        <button class="toast-close" type="button" aria-label="Fechar">×</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
